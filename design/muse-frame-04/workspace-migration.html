<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MUSE FRAME · 工作区</title>
  <link rel="stylesheet" href="/workspace-migration.css">
  <script type="module" src="/workspace-migration.mjs"></script>
</head>
<body>
  <main>
    <header><a href="/">MUSE FRAME</a><button type="button" id="language">English</button></header>
    <h1 data-copy="title">工作区迁移与备份</h1>
    <p data-copy="intro">从旧版接续拍摄、图片、作品和任务。每次迁移会创建一份独立工作区。</p>
    <section aria-labelledby="current-label">
      <h2 id="current-label" data-copy="current">当前工作区</h2>
      <p id="current"></p>
      <button type="button" id="backup" data-copy="backup">备份到文件夹</button>
      <button type="button" id="rollback" data-copy="rollback" disabled>回退到上一份工作区</button>
    </section>
    <section aria-labelledby="source-label">
      <h2 id="source-label" data-copy="source">旧工作区或备份</h2>
      <div id="detected" class="row" aria-label="Detected workspaces"></div>
      <div class="row">
        <input type="text" id="source" aria-labelledby="source-label">
        <button type="button" id="choose" data-copy="choose">选择文件夹</button>
        <button type="button" id="inspect" data-copy="inspect">检查内容</button>
      </div>
      <dl id="summary" hidden></dl>
      <button type="button" id="migrate" data-copy="migrate" disabled>迁入新版</button>
    </section>
    <p id="status" role="status" aria-live="polite"></p>
    <footer class="row">
      <a href="/" data-copy="back">返回工作台</a>
      <button type="button" id="quit" data-copy="quit">退出本机工作台</button>
    </footer>
  </main>
</body>
</html>
